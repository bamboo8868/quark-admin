
<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
    <meta name="generator" content="Hugo 0.108.0">
    <meta name="renderer" content="webkit">
    <title>steam账户</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="/static/js/bootstrap.min.js"></script>
    <script type="text/javascript" src="/static/js/axios.min.js"></script>
    <script type="text/javascript" src="/static/js/vue.min.js"></script>
    <!-- Favicons -->
    <meta name="theme-color" content="#712cf9">
    <style>
        :root {
            font-size:0.875rem;
        }
        .left {
            text-align: left;
        }

        .right {
            text-align: right;
        }

        .line-through-text {
            text-decoration: line-through;
        }

        .title-text {
            /* letter-spacing: 0.2rem; */
            /* font-size: 1.5rem;   */
            background-image: -webkit-linear-gradient(left, #147B96, #E6D205 25%, #147B96 50%, #E6D205 75%, #147B96);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
            -webkit-background-size: 200% 100%;
            -webkit-animation: maskedAnimation 4s infinite linear;
        }


        @keyframes maskedAnimation {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        .down {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 20px solid #0d6efd;
            font-size: 0;
            line-height: 0;
        }
        .w-100px {
            display:inline-block ;
            width:80px;
        }
    </style>
</head>

<body data-bs-theme="dark">
    <div class="page page-center" id="app" v-cloak>
        <div style="position:fixed;top:50%;left:50%;transform: translate(-50%, -50%);z-index:1000" v-show="alert_show">
            <div style="background-color: black;color:white" class="p-3">{{alert_text}}</div>
        </div>
        <div class="container container-tight py-4" style="max-width: 600px;">
            <div class="card card-md">
                <div class="card-body">
                    <h2 class="h2 text-center">{{ config.name  }}租号中心</h2>
                    <span style="color:red">客服不玩游戏的,只会让你们重启电脑,验证游戏完整性,大部分游戏问题客服也解决不了,有什么问题尽量百度上搜索。</span>
                    <div class="mb-3 mt-2">
                        <label class="form-label">请输入CDK<span style="color:red">【确认是否已下载游戏,提取即计时】</span></label>
                        <input v-model="cdk" type="text" class="form-control" placeholder="输入CDK兑换账号"
                            autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">请输入账号<span style="color:red">【适用于租过账号的,需要租指定账号】</span></label>
                        <input v-model="account" type="text" class="form-control" placeholder="输入Steam账号可选择指定账号,不填随机发"
                            autocomplete="off">
                    </div>
                    <div class="form-footer">
                        <button @click="submit()" type="submit" class="btn btn-primary w-100">提取账号</button>
                    </div>

                    <div v-if="!init">
                        <div class="mt-3">
                            <div><span class="w-100px">游戏:</span><span style="color:red;margin-left:10px">{{data.game_name}}</span></div>
                            
                        </div>
                        <div class="mt-1">
                            <div><span class="w-100px">账号:</span> <span style="color:red;margin-left:10px">{{data.account}}</span></div>
                           
                        </div>
                        <div class="mt-1">
                            <div><span class="w-100px">密码: </span> <span style="color:red;margin-left:10px">{{data.password}}</span></div>
                        </div>
                        <div class="mt-1">
                            <div>
                                <span class="w-100px">动态验证码: </span> 
                                <button style="margin-left: 10px;" @click="refresh()" type="submit" class="btn btn-primary btn-sm">获取验证码</button>
                                <span style="color:red;margin-left:10px">{{data.code }} </span>
                            </div>
                        
                        </div>
<!--                         <div class="mt-1">
                            <div>开始时间:</div>
                            <div style="color:red">{{data.start_time }} </div>
                        </div> -->
                        <div class="mt-1">
                            <div><span class="w-100px">到期时间:</span> <span style="color:red;margin-left: 10px">{{data.end_time }} </span></div>
                           
                        </div>
                        <div class="mt-1">
                            <button class="btn btn-danger" @click="rent_show=!rent_show">续费点这里</button>
                        </div>
                        <div class="mt-3 mb-3" v-show="rent_show">
                            <label class="form-label">请输入续费cdk</label>
                            <input v-model="renew_cdk" type="text" class="form-control" placeholder="输入CDK续费账号"
                                autocomplete="off">
                        </div>
                        <div class="form-footer" v-show="rent_show">
                            <button @click="rent()" type="submit" class="btn btn-primary w-100">续费</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let obj = new Vue({
            el: "#app",
            data: {
                cdk: '',
                account:'',
                init: true,
                rent_show: false,
                renew_cdk: '',
                alert_show:false,
                alert_text:"",
                config:{
                    name:'高能电玩'
                },
                data: {
                    account: '',
                    password: '',
                    start_time: "",
                    end_time: "",
                    game_name:'',
                    code: '点击左侧按钮获取动态验证码'
                }
            },
            methods: {
                showMessage(message) {
                    this.$data.alert_show = true;
                    this.$data.alert_text = message;
                    setTimeout(() => {
                        this.$data.alert_show = false;
                        this.$data.alert_text = ''
                    }, 2000)
                },
                submit() {
                    axios.post('/api/web/cdk/exchange', { cdk: this.cdk,account:this.account }).then(res => {
                        if (res.data.code === 0) {
                            this.init = false;
                            this.data.account = res.data.data.account;
                            this.data.password = res.data.data.password;
                            this.data.start_time = res.data.data.start_time;
                            this.data.end_time = res.data.data.end_time;
                            this.data.game_name = res.data.data.game_name;
                        } else {
                            this.showMessage(res.data.message);
                        }
                    })
                },
                rent() {
                    axios.post('/api/web/cdk/rent', { cdk: this.cdk, renew_cdk: this.renew_cdk }).then(res => {
                        if (res.data.code === 0) {
                            this.showMessage(res.data.message);
                            this.submit();
                        } else {
                            this.showMessage(res.data.message);
                        }
                    })
                },
                refresh() {
                    axios.post('/api/web/cdk/refresh', { cdk: this.cdk}).then(res => {
                        if (res.data.code === 0) {
                            this.data.code = res.data.data.code;
                        } else {
                            this.showMessage(res.data.message);
                        }
                    })
                }
            }
        })
    </script>
</body>

</html>
