syntax = "proto3";

package steam.request;

// ==================== CreateFamilyGroup ====================
// POST https://api.steampowered.com/IFamilyGroupsService/CreateFamilyGroup/v1

message CFamilyGroups_CreateFamilyGroup_Request {
  string name = 1;
}

message CFamilyGroups_CreateFamilyGroup_Response {
  uint64 family_groupid = 1;
  bool cooldown_skip_granted = 2;
}

// ==================== GetFamilyGroup ====================
// GET https://api.steampowered.com/IFamilyGroupsService/GetFamilyGroup/v1

message CFamilyGroups_GetFamilyGroup_Request {
  uint64 family_groupid = 1;
  bool send_running_apps = 2;
}

message FamilyGroupMember {
  fixed64 steamid = 1;
  EFamilyGroupRole role = 2;
  uint32 time_joined = 3;
  uint32 cooldown_seconds_remaining = 4;
}

message FamilyGroupPendingInvite {
  fixed64 steamid = 1;
  EFamilyGroupRole role = 2;
}

message FamilyGroupFormerMember {
  fixed64 steamid = 1;
}

message CFamilyGroups_GetFamilyGroup_Response {
  string name = 1;
  repeated FamilyGroupMember members = 2;
  repeated FamilyGroupPendingInvite pending_invites = 3;
  uint32 free_spots = 4;
  string country = 5;
  uint32 slot_cooldown_remaining_seconds = 6;
  repeated FamilyGroupFormerMember former_members = 7;
  uint32 slot_cooldown_overrides = 8;
}

// ==================== GetFamilyGroupForUser ====================
// GET https://api.steampowered.com/IFamilyGroupsService/GetFamilyGroupForUser/v1

message FamilyGroupPendingInviteForUser {
  uint64 family_groupid = 1;
  EFamilyGroupRole role = 2;
  fixed64 inviter_steamid = 3;
  bool awaiting_2fa = 4;
  uint64 invite_id = 5;
}

message CFamilyGroups_GetFamilyGroupForUser_Request {
  uint64 steamid = 1;
  bool include_family_group_response = 2;
}

message FamilyGroupMembership {
  uint64 family_groupid = 1;
  uint32 rtime_joined = 2;
  uint32 rtime_left = 3;
  uint32 role = 4;
  bool participated = 5;
}

message CFamilyGroups_GetFamilyGroupForUser_Response {
  uint64 family_groupid = 1;
  bool is_not_member_of_any_group = 2;
  uint32 latest_time_joined = 3;
  uint64 latest_joined_family_groupid = 4;
  repeated FamilyGroupPendingInviteForUser pending_group_invites = 5;
  uint32 role = 6;
  uint32 cooldown_seconds_remaining = 7;
  CFamilyGroups_GetFamilyGroup_Response family_group = 8;
  bool can_undelete_last_joined_family = 9;
  repeated FamilyGroupMembership membership_history = 10;
}

// ==================== ModifyFamilyGroupDetails ====================
// POST https://api.steampowered.com/IFamilyGroupsService/ModifyFamilyGroupDetails/v1

message CFamilyGroups_ModifyFamilyGroupDetails_Request {
  uint64 family_groupid = 1;
  string name = 2;
}

message CFamilyGroups_ModifyFamilyGroupDetails_Response {
}

// ==================== InviteToFamilyGroup ====================
// POST https://api.steampowered.com/IFamilyGroupsService/InviteToFamilyGroup/v1

message CFamilyGroups_InviteToFamilyGroup_Request {
  uint64 family_groupid = 1;
  fixed64 receiver_steamid = 2;
  EFamilyGroupRole receiver_role = 3;
}

message CFamilyGroups_InviteToFamilyGroup_Response {
  uint64 invite_id = 1;
  ETwoFactorMethod two_factor_method = 2;
}

// ==================== JoinFamilyGroup ====================
// POST https://api.steampowered.com/IFamilyGroupsService/JoinFamilyGroup/v1

message CFamilyGroups_JoinFamilyGroup_Request {
  uint64 family_groupid = 1;
  uint64 nonce = 2;
}

message CFamilyGroups_JoinFamilyGroup_Response {
  ETwoFactorMethod two_factor_method = 2;
  bool cooldown_skip_granted = 3;
  bool invite_already_accepted = 4;
  uint32 cooldown_seconds_remaining = 5;
}

// ==================== RemoveFromFamilyGroup ====================
// POST https://api.steampowered.com/IFamilyGroupsService/RemoveFromFamilyGroup/v1

message CFamilyGroups_RemoveFromFamilyGroup_Request {
  uint64 family_groupid = 1;
  fixed64 steamid_to_remove = 2;
}

message CFamilyGroups_RemoveFromFamilyGroup_Response {
}

// ==================== CancelFamilyGroupInvite ====================
// POST https://api.steampowered.com/IFamilyGroupsService/CancelFamilyGroupInvite/v1

message CFamilyGroups_CancelFamilyGroupInvite_Request {
  uint64 family_groupid = 1;
  fixed64 steamid_to_cancel = 2;
}

message CFamilyGroups_CancelFamilyGroupInvite_Response {
}

// ==================== DeleteFamilyGroup ====================
// POST https://api.steampowered.com/IFamilyGroupsService/DeleteFamilyGroup/v1

message CFamilyGroups_DeleteFamilyGroup_Request {
  uint64 family_groupid = 1;
}

message CFamilyGroups_DeleteFamilyGroup_Response {
}

// ==================== Parental (家长控制 / Family View) ====================
// Client unified service "Parental", sent over a logged-in CM session via
// EMsg.ServiceMethodCallFromClient with target_job_name "Parental.<Method>#1".
// Field numbers/types below were extracted from Steam's own jspb bundle and
// match steam-user's bundled steammessages_parental.steamclient.proto.

message ParentalApp {
  uint32 appid = 1;
  bool is_allowed = 2;
}

message ParentalPlaytimeDay {
  uint64 allowed_time_windows = 1;
  uint32 allowed_daily_minutes = 2;
}

message ParentalPlaytimeRestrictions {
  bool apply_playtime_restrictions = 2;
  repeated ParentalPlaytimeDay playtime_days = 15;
}

message ParentalTemporaryPlaytimeRestrictions {
  ParentalPlaytimeDay restrictions = 1;
  uint32 rtime_expires = 2;
}

message ParentalSettings {
  fixed64 steamid = 1;
  uint32 applist_base_id = 2;
  string applist_base_description = 3;
  repeated ParentalApp applist_base = 4;
  repeated ParentalApp applist_custom = 5;
  uint32 passwordhashtype = 6;
  bytes salt = 7;
  bytes passwordhash = 8;
  bool is_enabled = 9;
  uint32 enabled_features = 10;
  string recovery_email = 11;
  bool is_site_license_lock = 12;
  uint32 temporary_enabled_features = 13;
  uint32 rtime_temporary_feature_expiration = 14;
  ParentalPlaytimeRestrictions playtime_restrictions = 15;
  ParentalTemporaryPlaytimeRestrictions temporary_playtime_restrictions = 16;
  repeated uint32 excluded_store_content_descriptors = 17;
  repeated uint32 excluded_community_content_descriptors = 18;
  repeated uint32 utility_appids = 19;
}

message CParental_EnableParentalSettings_Request {
  string password = 1;
  ParentalSettings settings = 2;
  string sessionid = 3;
  uint32 enablecode = 4;
  fixed64 steamid = 10;
}

message CParental_EnableParentalSettings_Response {
}

message CParental_DisableParentalSettings_Request {
  string password = 1;
  fixed64 steamid = 10;
}

message CParental_DisableParentalSettings_Response {
}

message CParental_GetParentalSettings_Request {
  fixed64 steamid = 10;
}

message CParental_GetParentalSettings_Response {
  ParentalSettings settings = 1;
}

// ==================== Enums ====================

enum EFamilyGroupRole {
  k_EFamilyGroupRole_None = 0;
  k_EFamilyGroupRole_Adult = 1;
  k_EFamilyGroupRole_Child = 2;
}

enum ETwoFactorMethod {
  k_ETwoFactorMethod_None = 0;
  k_ETwoFactorMethod_EmailCode = 1;
  k_ETwoFactorMethod_SmsCode = 2;
}
